<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Personal AI Knowledge Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Personal AI Knowledge Wiki">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <link rel="stylesheet" href=".obsidian/snippets/wiki-style.css">
  <style>
    :root {
      --base-font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      --theme-color: #2b6cb0;
      --sidebar-width: 290px;
      --content-max-width: 950px;
    }
    .sidebar {
      background: #f8fafc;
      border-right: 1px solid #e2e8f0;
    }
    .app-name-link {
      font-weight: 800 !important;
      font-size: 1.25rem !important;
      color: #1a202c !important;
    }
  </style>
</head>
<body>
  <div id="app">위키를 로딩 중입니다...</div>
  <script>
    window.$docsify = {
      name: '📚 AI Knowledge Wiki',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '위키 검색...',
        noData: '검색 결과가 없습니다',
        depth: 4
      },
      copyCode: {
        buttonText: '복사',
        errorText: '실패',
        successText: '복사됨'
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/front-matter.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
